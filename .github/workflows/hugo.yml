name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling one that is already in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pages can take a few minutes to go live; deploy-pages gives up after 10.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install Hugo CLI
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Hugo
        run: hugo --cleanDestinationDir --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
